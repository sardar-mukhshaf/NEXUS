apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: example-db-credentials
  namespace: default
  annotations:
    description: "Example ExternalSecret syncing from AWS Secrets Manager"
    argocd.argoproj.io/tracking-id: "example-db-credentials"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: nexus/dev/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: nexus/dev/db-credentials
        property: password
