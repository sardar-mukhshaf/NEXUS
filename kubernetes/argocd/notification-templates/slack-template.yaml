apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  annotations:
    description: "ArgoCD notification templates for Slack and PagerDuty"
    argocd.argoproj.io/tracking-id: "argocd-notifications-cm"
data:
  template.on-sync-failed: |
    email:
      subject: Application {{.app.metadata.name}} sync failed
    message: |
      Application {{.app.metadata.name}} has sync failed.
      Environment: {{.app.metadata.namespace}}
      Sync Status: {{.app.status.sync.status}}
      Operation State: {{.app.status.operationState.phase}}
      Error: {{.app.status.operationState.message}}
    slack:
      attachments: |
        [{
          "title": "ArgoCD Sync Failed: {{.app.metadata.name}}",
          "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
          "color": "#FF0000",
          "fields": [
            {
              "title": "Environment",
              "value": "{{.app.metadata.namespace}}",
              "short": true
            },
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Error",
              "value": "{{.app.status.operationState.message}}",
              "short": false
            }
          ]
        }]

  template.on-sync-succeeded: |
    email:
      subject: Application {{.app.metadata.name}} sync succeeded
    message: |
      Application {{.app.metadata.name}} has been successfully synced.
      Environment: {{.app.metadata.namespace}}
      Revision: {{.app.status.sync.revision}}
    slack:
      attachments: |
        [{
          "title": "ArgoCD Sync Succeeded: {{.app.metadata.name}}",
          "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
          "color": "#36a64f",
          "fields": [
            {
              "title": "Environment",
              "value": "{{.app.metadata.namespace}}",
              "short": true
            },
            {
              "title": "Revision",
              "value": "{{.app.status.sync.revision}}",
              "short": true
            }
          ]
        }]

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase == 'Failed'
      send: [on-sync-failed]

  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase == 'Succeeded'
      send: [on-sync-succeeded]
