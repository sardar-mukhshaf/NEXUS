apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmp-cm
  namespace: argocd
  annotations:
    description: "ArgoCD Config Management Plugin for SOPS decryption"
    argocd.argoproj.io/tracking-id: "argocd-cmp-cm"
data:
  sops-decrypt.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: sops-decrypt
    spec:
      version: v1.0
      init:
        command: [sh, -c]
        args:
          - |
            apt-get update && apt-get install -y curl &&
            curl -LO https://github.com/getsops/sops/releases/download/v3.8.1/sops-v3.8.1.linux.amd64 &&
            install -m 755 sops-v3.8.1.linux.amd64 /usr/local/bin/sops
      generate:
        command: [sh, -c]
        args:
          - |
            find . -name '*.enc.yaml' -exec sops -d -i {} \;
            find . -name '*.enc.json' -exec sops -d -i {} \;
            cat .
      discover:
        fileName: "*.enc.yaml"
