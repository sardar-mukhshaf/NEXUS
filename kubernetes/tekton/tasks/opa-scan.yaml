apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: opa-scan
  namespace: tekton-pipelines
  annotations:
    description: "Run OPA/Conftest scan on Terraform plan"
    argocd.argoproj.io/tracking-id: "opa-scan-task"
spec:
  workspaces:
    - name: source
    - name: policies
  params:
    - name: plan-file
      type: string
      default: plan.json
    - name: tf-dir
      type: string
  steps:
    - name: conftest
      image: openpolicyagent/conftest:v0.49.0@sha256:REPLACE_WITH_DIGEST
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      workingDir: $(workspaces.source.path)/$(params.tf-dir)
      script: |
        #!/usr/bin/env sh
        set -e
        conftest test $(params.plan-file) -p $(workspaces.policies.path)/conftest/terraform
    - name: opa-eval
      image: openpolicyagent/opa:0.61.0@sha256:REPLACE_WITH_DIGEST
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      workingDir: $(workspaces.source.path)/$(params.tf-dir)
      script: |
        #!/usr/bin/env sh
        opa eval --data $(workspaces.policies.path)/opa/terraform \
          --input $(params.plan-file) \
          "data.terraform.deny" --format pretty
