apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: microservice-build-and-deploy
  namespace: tekton-pipelines
  annotations:
    description: "Build, scan, and deploy a microservice"
    argocd.argoproj.io/tracking-id: "microservice-build-pipeline"
spec:
  workspaces:
    - name: source
    - name: dockerconfig
    - name: policies
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
      default: main
    - name: image
      type: string
    - name: project-key
      type: string
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: source
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)

    - name: sonar
      taskRef:
        name: sonarqube-scan
      runAfter: [clone]
      workspaces:
        - name: source
          workspace: source
      params:
        - name: project-key
          value: $(params.project-key)
        - name: sonar-host
          value: https://sonar.nexus-platform.local

    - name: build
      taskRef:
        name: kaniko-build
      runAfter: [sonar]
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: image
          value: $(params.image)

    - name: opa-scan
      taskRef:
        name: opa-scan
      runAfter: [build]
      workspaces:
        - name: source
          workspace: source
        - name: policies
          workspace: policies
