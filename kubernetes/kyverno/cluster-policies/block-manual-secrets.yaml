apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-manual-secrets
  annotations:
    policies.kyverno.io/title: "Block Manual Secret Creation"
    policies.kyverno.io/category: "Security"
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "Secret"
    policies.kyverno.io/description: "Prevents manual creation of secrets via kubectl"
    argocd.argoproj.io/tracking-id: "block-manual-secrets"
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: block-kubectl-create-secret
      match:
        resources:
          kinds:
            - Secret
      exclude:
        resources:
          namespaces:
            - kube-system
            - kyverno
            - falco
            - atlantis
            - argocd
            - external-secrets
      preconditions:
        all:
          - key: "{{request.operation}}"
            operator: Equals
            value: CREATE
      validate:
        message: "Manual secret creation is blocked. Use External Secrets Operator instead."
        deny:
          conditions:
            all:
              - key: "{{request.operation}}"
                operator: Equals
                value: CREATE
