apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: "Require Non-Root Containers"
    policies.kyverno.io/category: "Security"
    policies.kyverno.io/severity: "critical"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/description: "Containers must run as non-root with read-only root filesystem and dropped capabilities"
    argocd.argoproj.io/tracking-id: "require-non-root"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-security-context
      match:
        resources:
          kinds:
            - Pod
      exclude:
        resources:
          namespaces:
            - kube-system
            - kyverno
            - falco
            - atlantis
            - argocd
            - external-secrets
      validate:
        message: "Container must have runAsNonRoot: true, readOnlyRootFilesystem: true, and drop ALL capabilities."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
