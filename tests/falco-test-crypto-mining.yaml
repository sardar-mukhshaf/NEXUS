# =============================================================================
# NEXUS PLATFORM — Falco Test Pod
# Simulates crypto-mining activity to verify Falco detection.
# WARNING: This is a TEST pod only. Do not deploy to production.
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: falco-test-crypto-mining
  namespace: default
  labels:
    app: falco-test
    test-type: runtime-detection
spec:
  containers:
    - name: crypto-miner-simulator
      image: busybox:1.36@sha256:REPLACE_WITH_DIGEST
      command: ["/bin/sh"]
      args:
        - -c
        - |
          echo "Simulating crypto mining connection..."
          nc -z pool.minergate.com 45700 || true
          echo "Test complete. Falco should detect this activity."
          sleep 60
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
        requests:
          cpu: "50m"
          memory: "32Mi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
  restartPolicy: Never
